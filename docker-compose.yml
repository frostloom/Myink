# Myink 一键启动全部服务（PostgreSQL+pgvector / Redis / RabbitMQ / Python API / Worker / Caddy 边缘）。
# 用法：docker compose up -d --build
#   唯一入口是 Caddy：http://localhost（SITE_ADDRESS 默认 http://localhost，同源出页面+API+SSE）。
#   业务进程只有 Python 两个：myink-api（全部路由，含 SSE 进度流）与 myink-worker。
# 首次初始化：pg 挂载 docker/initdb 建 myink_app 角色（NOBYPASSRLS）；api 先跑 `myink init`
# （幂等：建表 + RLS，默认不建账号与示例书）再起 uvicorn。需要开发示例数据时手工执行
# `myink init --seed`；首个账号用 `myink create-invite` 发码注册。
name: myink

services:
  myink-pg:
    # 国内网络 daocloud 前缀更稳（docker.io 直连超时）；境外可用 PG_IMAGE=pgvector/pgvector:pg16 覆盖
    image: ${PG_IMAGE:-docker.m.daocloud.io/pgvector/pgvector:pg16}
    container_name: myink-pg
    environment:
      POSTGRES_USER: myink
      POSTGRES_PASSWORD: myink
      POSTGRES_DB: myink
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # 显式 volume 名：更名 Myink 时数据卷从旧的 aiink_pgdata_v2 复制迁移而来（库/角色同步改名）；
      # 更早手工时代的 aiink_pgdata 卷仍在原地未动，如需找回可手动挂回
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myink -d myink"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  myink-redis:
    # 国内网络 daocloud 前缀更稳；境外可用 REDIS_IMAGE=redis:7-alpine 覆盖
    image: ${REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7-alpine}
    container_name: myink-redis
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # 阶段 6：RabbitMQ 任务队列（替代 Redis Streams 主队列 + ZSET 延迟 + 网关 dispatcher）。
  # guest/guest 仅限 loopback，compose 网络内必须建真实用户 myink/myink（RABBITMQ_DEFAULT_USER/PASS
  # 仅对全新数据卷生效）；拓扑（主队列 x-max-priority + DLX / 延迟 TTL+DLX / 死信）由
  # Go/Python 三端幂等声明，参数变更需清 rabbitmq-data 卷否则 PRECONDITION_FAILED。
  myink-rabbitmq:
    image: ${RABBITMQ_IMAGE:-docker.m.daocloud.io/library/rabbitmq:3.13-management}
    container_name: myink-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: myink
      RABBITMQ_DEFAULT_PASS: myink
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672" # Management UI（myink/myink）
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      # check_port_connectivity 才真正验证 5672 能接连接（ping 只查 erlang 节点注册到 epmd，
      # 是存活探针不是就绪探针，会让 worker 在监听器就绪前被放行 → 启动竞态）。
      # gosu 降权到 rabbitmq：healthcheck 的 docker exec 默认以 root 跑，
      # 若抢在 broker 之前创建 .erlang.cookie 会写出 root:root 0400 把 uid 999 锁死。
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  # Python API：只升级数据库，不在每次启动时重建示例账号（仅内部监听，网关转发入口）。
  # env_file 注入 .env（JWT / 加密主密钥等）；environment 显式覆盖网络相关项
  # （compose 优先级 environment > env_file；本地 localhost 串在容器网络内必须换服务名）。
  myink-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 国内网络：基础镜像 / pip 依赖走国内源（Dockerfile 默认 docker.io / pypi.org；阿里云对 torch 等大文件更稳）
        PYTHON_IMAGE: docker.m.daocloud.io/library/python:3.12-slim
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
    image: myink-api:local
    container_name: myink-api
    env_file: .env
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+psycopg://myink_app:myink@myink-pg:5432/myink
      ADMIN_DATABASE_URL: postgresql+psycopg://myink:myink@myink-pg:5432/myink
      REDIS_URL: redis://myink-redis:6379/0
      AMQP_URL: amqp://myink:myink@myink-rabbitmq:5672/
      API_HOST: 0.0.0.0
      API_PORT: "8100"
      # 向量默认关：bge-m3 首次要下载 ~2.2GB 模型，纯关系链路降级可用（config.py 声明）。开法见 docs/DEPLOY.md
      EMBED_ENABLED: "0"
      REQUEST_TOKEN_BUDGET: ${REQUEST_TOKEN_BUDGET:-64000}
      RECALL_TOKEN_BUDGET: ${RECALL_TOKEN_BUDGET:-12000}
      # 用 ${...} 而不是只靠 env_file：宿主 shell 里 export 能覆盖到容器，
      # 也与 .env.example 保持单一真源。
      RATE_PER_SEC: ${RATE_PER_SEC:-20}
      RATE_BURST: ${RATE_BURST:-40}
      # 扫榜灵感（§10：直连番茄公开榜单）+ MCP 客户端地址（留作后续接其他 MCP 工具）
      RANKINGS_ENABLED: "1"
      RANKINGS_MCP_URL: https://daosearch.io/api/mcp
    command: ["sh", "-c", "myink init && myink-api"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8100/openapi.json')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      myink-pg:
        condition: service_healthy
      myink-redis:
        condition: service_healthy
      myink-rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Worker：消费 RabbitMQ 主队列跑 LangGraph（api/worker 共用同一 Python 镜像，仅 command 不同）。
  myink-worker:
    image: myink-api:local
    container_name: myink-worker
    env_file: .env
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+psycopg://myink_app:myink@myink-pg:5432/myink
      ADMIN_DATABASE_URL: postgresql+psycopg://myink:myink@myink-pg:5432/myink
      REDIS_URL: redis://myink-redis:6379/0
      AMQP_URL: amqp://myink:myink@myink-rabbitmq:5672/
      EMBED_ENABLED: "0"
      REQUEST_TOKEN_BUDGET: ${REQUEST_TOKEN_BUDGET:-64000}
      RECALL_TOKEN_BUDGET: ${RECALL_TOKEN_BUDGET:-12000}
      # 扫榜灵感只用于建书前题材参考，不注入 worker 生成节点
      RANKINGS_ENABLED: "1"
      RANKINGS_MCP_URL: https://daosearch.io/api/mcp
    command: ["myink-worker"]
    depends_on:
      myink-pg:
        condition: service_healthy
      myink-redis:
        condition: service_healthy
      myink-api:
        condition: service_started
      myink-rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Caddy 边缘层：TLS + 前端静态托管 + SPA 回退 + 按路径分流。
  # 原先由网关兼任的「公网入口 + 发前端」职责交到这里，网关收缩为只服务 SSE。
  # SITE_ADDRESS 三种取值见 caddy/Caddyfile 顶部注释：http://localhost（本地纯 HTTP，默认）
  # / localhost（本地自签 HTTPS）/ 域名（生产，ACME 自动签发续期）。
  myink-caddy:
    build:
      context: .
      dockerfile: caddy/Dockerfile
      args:
        # 国内网络：node/caddy 基础镜像走 daocloud；npm 包走 npmmirror
        NODE_IMAGE: docker.m.daocloud.io/library/node:20-alpine
        CADDY_IMAGE: docker.m.daocloud.io/library/caddy:2.11.4-alpine
        NPM_REGISTRY: https://registry.npmmirror.com
    image: myink-caddy:local
    container_name: myink-caddy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      # 证书与 ACME 账户必须持久化：不落盘则每次重启都重新签发，会撞 Let's Encrypt 速率限制
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      # 打 admin API 而不是站点本身：HTTPS 模式下 :80 会 301 到 :443，且证书可能是自签的，
      # 两种模式共用的稳定探法只有进程内的管理端点（见 Caddyfile 的 admin 127.0.0.1:2019）
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      myink-api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
    name: myink_pgdata_v2   # 更名 Myink 时由 aiink_pgdata_v2 复制迁移（见 myink-pg 注释）
  rabbitmq-data:            # RabbitMQ 数据卷（拓扑参数变更时需清空重建，见 myink-rabbitmq 注释）
  caddy-data:               # Caddy 证书 / ACME 账户（删掉＝下次启动重新签发，见 myink-caddy 注释）
  caddy-config:             # Caddy 自动生成的运行配置
