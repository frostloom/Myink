# Myink 一键启动全部服务（PostgreSQL+pgvector / Redis / RabbitMQ / Python API / Worker / Caddy 边缘）。
# 用法：docker compose up -d --build
#   唯一入口是 Caddy：http://localhost（SITE_ADDRESS 默认 http://localhost，同源出页面+API+SSE）。
#   业务进程只有 Python 两个：myink-api（全部路由，含 SSE 进度流）与 myink-worker。
# 首次初始化：pg 挂载 docker/initdb 建 myink_app 角色（NOBYPASSRLS）；api 先跑 `myink init`
# （幂等：建表 + RLS，默认不建账号与示例书）再起 uvicorn。需要开发示例数据时手工执行
# `myink init --seed`；首个账号用 `myink create-invite` 发码注册。
name: myink

# 容器日志一律限大小：默认 json-file 驱动不轮转，单 VPS 上访问日志会把盘写满
# （和 pgdata 同盘，写满即全站不可用）。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  myink-pg:
    # 国内网络 daocloud 前缀更稳（docker.io 直连超时）；境外可用 PG_IMAGE=pgvector/pgvector:pg16 覆盖
    image: ${PG_IMAGE:-docker.m.daocloud.io/pgvector/pgvector:pg16}
    container_name: myink-pg
    environment:
      POSTGRES_USER: myink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myink}
      POSTGRES_DB: myink
      # 只给首启的 initdb 用：给 myink_app 角色定的密码，必须与上面 API 的 DATABASE_URL 一致。
      # 仅对全新数据卷生效（已有卷的角色密码不会跟着改）。
      MYINK_APP_PASSWORD: ${MYINK_APP_PASSWORD:-myink}
      # 同上，给只读报表角色 myink_report（必须与 myink-api 的 ADMIN_DATABASE_URL 一致）。
      MYINK_REPORT_PASSWORD: ${MYINK_REPORT_PASSWORD:-myink}
    logging: *default-logging
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # 显式 volume 名：更名 Myink 时数据卷从旧的 aiink_pgdata_v2 复制迁移而来（库/角色同步改名）；
      # 更早手工时代的 aiink_pgdata 卷仍在原地未动，如需找回可手动挂回
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myink -d myink"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  myink-redis:
    # 国内网络 daocloud 前缀更稳；境外可用 REDIS_IMAGE=redis:7-alpine 覆盖
    image: ${REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7-alpine}
    container_name: myink-redis
    environment:
      # 只被下面的 requirepass 与健康检查读；业务侧凭据在 REDIS_URL 里。
      REDIS_PASSWORD: ${REDIS_PASSWORD:-myink}
    # 队列锁、闸门令牌、心跳都在这上面，且同机其它进程也能连到 6379：
    # 不加认证时任何本地进程都能改任务队列，所以默认就开。
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-myink}"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *default-logging

  # 阶段 6：RabbitMQ 任务队列（替代 Redis Streams 主队列 + ZSET 延迟 + 网关 dispatcher）。
  # guest/guest 仅限 loopback，compose 网络内必须建真实用户 myink/myink（RABBITMQ_DEFAULT_USER/PASS
  # 仅对全新数据卷生效）；拓扑（主队列 x-max-priority + DLX / 延迟 TTL+DLX / 死信）由
  # Go/Python 三端幂等声明，参数变更需清 rabbitmq-data 卷否则 PRECONDITION_FAILED。
  myink-rabbitmq:
    image: ${RABBITMQ_IMAGE:-docker.m.daocloud.io/library/rabbitmq:3.13-management}
    container_name: myink-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: myink
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-myink}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672" # Management UI（用户名 myink）
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      # check_port_connectivity 才真正验证 5672 能接连接（ping 只查 erlang 节点注册到 epmd，
      # 是存活探针不是就绪探针，会让 worker 在监听器就绪前被放行 → 启动竞态）。
      # gosu 降权到 rabbitmq：healthcheck 的 docker exec 默认以 root 跑，
      # 若抢在 broker 之前创建 .erlang.cookie 会写出 root:root 0400 把 uid 999 锁死。
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30
    restart: unless-stopped
    logging: *default-logging

  # 一次性迁移 job：建表 + RLS + 各 ensure_* 幂等升级，跑完即退（`myink init` 本身幂等，
  # 重复 up 不会重复干坏事）。**这是全栈唯一持有超级用户串的地方**——api 与 worker 都只
  # 拿 myink_app（api 额外拿只读报表角色），DDL 权限不落在长期运行的进程里。
  # restart: "no"：跑完就该是 exited(0)；api/worker 用 service_completed_successfully 等它。
  # 不设 mem_limit/cpus：只在启动瞬间跑一次，且要与 api/worker 争抢同一台机器的时间极短。
  myink-migrate:
    image: myink-api:local
    container_name: myink-migrate
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql+psycopg://myink_app:${MYINK_APP_PASSWORD:-myink}@myink-pg:5432/myink
      ADMIN_DATABASE_URL: postgresql+psycopg://myink:${POSTGRES_PASSWORD:-myink}@myink-pg:5432/myink
      REDIS_URL: redis://:${REDIS_PASSWORD:-myink}@myink-redis:6379/0
      AMQP_URL: amqp://myink:${RABBITMQ_PASSWORD:-myink}@myink-rabbitmq:5672/
      # 向量表在建表期是否创建按 config 默认走；这里与 api 保持一致，关掉即可。
      EMBED_ENABLED: "0"
    command: ["myink", "init"]
    depends_on:
      myink-pg:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  # Python API：不再跑迁移（见上面的 myink-migrate），启动即可服务
  # （仅内部监听，网关转发入口）。
  # env_file 注入 .env（JWT / 加密主密钥等）；environment 显式覆盖网络相关项
  # （compose 优先级 environment > env_file；本地 localhost 串在容器网络内必须换服务名）。
  myink-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 国内网络：基础镜像 / pip 依赖走国内源（Dockerfile 默认 docker.io / pypi.org；阿里云对 torch 等大文件更稳）
        PYTHON_IMAGE: docker.m.daocloud.io/library/python:3.12-slim
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
        # 构建来源：部署时 export GIT_REVISION=$(git rev-parse --short HEAD) 再 build，
        # 之后 `docker inspect` 就能回答「线上跑的是哪一版」，见 docs/DEPLOY.md。
        GIT_REVISION: ${GIT_REVISION:-unknown}
    image: myink-api:local
    container_name: myink-api
    # 资源上限只是**天花板**，不是预留（实测 api ~154MB；机器是 4 vCPU / 3.6GB）。
    # 目的是让跑飞的进程 OOM 掉自己，而不是把整机拖死。pg/redis/rabbitmq 刻意没设：
    # 有状态服务被 OOM kill 比跑飞更糟。
    mem_limit: 1g
    cpus: 2.0
    env_file: .env
    environment:
      # 正式部署在 .env 里写 APP_ENV=prod：config.py 的守卫会拒绝 dev 默认 JWT 密钥、
      # 收紧校验。这里必须能从外部注入，否则 prod 守卫永远不生效。
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql+psycopg://myink_app:${MYINK_APP_PASSWORD:-myink}@myink-pg:5432/myink
      # 名字仍叫 ADMIN_DATABASE_URL（db.py/cli.py 那条迁移路径共用这一个变量），但**在 api
      # 容器里它指向只读报表角色**：api 只拿它跑 /admin 的跨租户统计（admin_read_session），
      # 从不执行 DDL——建表已经交给 myink-migrate 那个一次性 job。库里还给这个角色配了
      # default_transaction_read_only，所以端口写错也改不动数据。超级用户串只在 migrate 里出现。
      ADMIN_DATABASE_URL: postgresql+psycopg://myink_report:${MYINK_REPORT_PASSWORD:-myink}@myink-pg:5432/myink
      REDIS_URL: redis://:${REDIS_PASSWORD:-myink}@myink-redis:6379/0
      AMQP_URL: amqp://myink:${RABBITMQ_PASSWORD:-myink}@myink-rabbitmq:5672/
      API_HOST: 0.0.0.0
      API_PORT: "8100"
      # 向量默认关：bge-m3 首次要下载 ~2.2GB 模型，纯关系链路降级可用（config.py 声明）。开法见 docs/DEPLOY.md
      EMBED_ENABLED: "0"
      REQUEST_TOKEN_BUDGET: ${REQUEST_TOKEN_BUDGET:-64000}
      RECALL_TOKEN_BUDGET: ${RECALL_TOKEN_BUDGET:-12000}
      # 用 ${...} 而不是只靠 env_file：宿主 shell 里 export 能覆盖到容器，
      # 也与 .env.example 保持单一真源。
      RATE_PER_SEC: ${RATE_PER_SEC:-20}
      RATE_BURST: ${RATE_BURST:-40}
      # 扫榜灵感（§10：直连番茄公开榜单）
      RANKINGS_ENABLED: "1"
      # 用户反馈附件落盘目录：必须是卷挂载点，否则重建容器就丢
      FEEDBACK_DIR: /data/feedback
    volumes:
      - feedback-data:/data/feedback
    command: ["myink-api"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8100/openapi.json')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      myink-pg:
        condition: service_healthy
      myink-redis:
        condition: service_healthy
      myink-rabbitmq:
        condition: service_healthy
      # 迁移没成功就不放行：新代码要读的列/表全在它那一步建出来，
      # 抢跑只会得到满屏「column does not exist」。
      myink-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *default-logging

  # Worker：消费 RabbitMQ 主队列跑 LangGraph（api/worker 共用同一 Python 镜像，仅 command 不同）。
  # 开两份：prefetch=1 + 单线程消费，一个进程同时只跑一个任务（consumer.py），所以第二个用户
  # 的书要等到第一个用户的任务跑完才动。多开一个进程，多本书才真正并行。
  # 多实例是安全的：锁按资源分（lock:task:{id} / lock:book:{pid}），抢不到就是抢不到；
  # 崩溃重投由 process() 先重查锁与 DB 状态兜住，重复投递不会跑两遍。
  # 副本数写在这里而不是 `--scale`：--scale 不落盘，下一次 `docker compose up -d` 会缩回一份。
  # 因此这里也不能有 container_name——它跟副本数互斥，写了就起不了第二个。
  # 注意内存：EMBED_ENABLED=0 时一份约 110MB，开了本地 embedding 每份要再加约 2GB（bge-m3）。
  myink-worker:
    image: myink-api:local
    deploy:
      replicas: 2
    # 每份 1g：实测约 120MB，余量足够。注意 EMBED_ENABLED 打开后一份还要再加约 2GB
    #（bge-m3），那时必须同时抬高这个值，否则会被 OOM kill。
    mem_limit: 1g
    cpus: 2.0
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql+psycopg://myink_app:${MYINK_APP_PASSWORD:-myink}@myink-pg:5432/myink
      # worker 不跑迁移、也不做跨租户统计，全程只需要 myink_app 这一个受 RLS 约束的连接。
      # 显式置空而不是「不写这一行」：env_file 会把 .env 里的 ADMIN_DATABASE_URL 注进来，
      # 生产那个值是表 owner 超级用户串——写在 environment 里才能压住它。
      # 空串在 config.py 里会落回本机默认串，db.py 那个 admin engine 因此永远连不上，正合意图。
      ADMIN_DATABASE_URL: ""
      REDIS_URL: redis://:${REDIS_PASSWORD:-myink}@myink-redis:6379/0
      AMQP_URL: amqp://myink:${RABBITMQ_PASSWORD:-myink}@myink-rabbitmq:5672/
      EMBED_ENABLED: "0"
      REQUEST_TOKEN_BUDGET: ${REQUEST_TOKEN_BUDGET:-64000}
      RECALL_TOKEN_BUDGET: ${RECALL_TOKEN_BUDGET:-12000}
      # 扫榜灵感只用于建书前题材参考，不注入 worker 生成节点
      RANKINGS_ENABLED: "1"
    command: ["myink-worker"]
    depends_on:
      myink-pg:
        condition: service_healthy
      myink-redis:
        condition: service_healthy
      myink-api:
        condition: service_started
      myink-rabbitmq:
        condition: service_healthy
      # 与 api 同一条纪律：表/列先建好再消费，否则第一条任务就撞 missing column。
      myink-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *default-logging

  # Caddy 边缘层：TLS + 前端静态托管 + SPA 回退 + 按路径分流。
  # 原先由网关兼任的「公网入口 + 发前端」职责交到这里，网关收缩为只服务 SSE。
  # SITE_ADDRESS 三种取值见 caddy/Caddyfile 顶部注释：http://localhost（本地纯 HTTP，默认）
  # / localhost（本地自签 HTTPS）/ 域名（生产，ACME 自动签发续期）。
  myink-caddy:
    build:
      context: .
      dockerfile: caddy/Dockerfile
      args:
        # 国内网络：node/caddy 基础镜像走 daocloud；npm 包走 npmmirror
        NODE_IMAGE: docker.m.daocloud.io/library/node:20-alpine
        CADDY_IMAGE: docker.m.daocloud.io/library/caddy:2.11.4-alpine
        NPM_REGISTRY: https://registry.npmmirror.com
        GIT_REVISION: ${GIT_REVISION:-unknown}
    image: myink-caddy:local
    container_name: myink-caddy
    # 实测约 21MB；上限只防跑飞。
    mem_limit: 256m
    cpus: 1.0
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
      # 裸 IP 上 HTTPS 才需要的两项，默认值等于「不做任何覆盖」（见 caddy/Caddyfile 注释）：
      #   CADDY_SITE_TLS   站点块 import 哪个 TLS 片段
      #   CADDY_DEFAULT_SNI 客户端不发 SNI 时的选证书兜底（填公网 IP）
      CADDY_SITE_TLS: ${CADDY_SITE_TLS:-tls-auto.caddyfile}
      CADDY_DEFAULT_SNI: ${CADDY_DEFAULT_SNI:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      # 证书与 ACME 账户必须持久化：不落盘则每次重启都重新签发，会撞 Let's Encrypt 速率限制
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      # 打 admin API 而不是站点本身：HTTPS 模式下 :80 会 301 到 :443，且证书可能是自签的，
      # 两种模式共用的稳定探法只有进程内的管理端点（见 Caddyfile 的 admin 127.0.0.1:2019）
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      myink-api:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

volumes:
  pgdata:
    name: myink_pgdata_v2   # 更名 Myink 时由 aiink_pgdata_v2 复制迁移（见 myink-pg 注释）
  rabbitmq-data:            # RabbitMQ 数据卷（拓扑参数变更时需清空重建，见 myink-rabbitmq 注释）
  caddy-data:               # Caddy 证书 / ACME 账户（删掉＝下次启动重新签发，见 myink-caddy 注释）
  caddy-config:             # Caddy 自动生成的运行配置
  feedback-data:            # 用户反馈附件（问题描述里的图片/视频），不可重建，必须持久化
