[project]
name = "aiink"
version = "0.1.0"
description = "Ai Ink - 面向长篇网文的多 Agent 智能创作助手（推理层，阶段 1）"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "openai>=1.30",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    # 阶段 2：Redis 队列 + Python API（§阶段2，worker/api 复用核心模块）
    "redis>=5.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=2.0",
    # 阶段 3：JWT 身份断言（§14.1 ③，签发端点；网关验签走 golang-jwt，密钥共享 .env）
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# 向量能力（§5.2 一库多用）：bge-m3 本地 embedding（1024 维），DeepSeek 官方无 embedding 接口故本地加载。
# 默认不装（torch 依赖 ~2GB、国内镜像源下载易抖）：embedder 延迟导入，EMBED_ENABLED=0 完全不加载，
# 纯关系链路降级可用（§6.12 数据层）。需要时 `pip install -e .[ml]`（Docker 镜像按需，见 docs/DEPLOY.md）。
ml = [
    "sentence-transformers>=3.0",
]

[project.scripts]
aiink = "aiink.cli:app"
aiink-worker = "aiink.worker.entry:run"
aiink-api = "aiink.api.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
