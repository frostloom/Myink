# Ai Ink CI：PR / 主分支门禁（格式检查 + 全量回归 + 镜像构建，plan.md §阶段 5 余项「CI」）。
# 四个 job 并行：python（全新 PG + Redis 服务容器，测前 aiink init）/ go（网关 vet+test）/ frontend / build-images。
# 关键设计：Python 测试用「全新 PG」服务容器——刚修过的部署 bug（索引名冲突 / schema CREATE 权限）
# 都是全新库才暴露的类型，CI 用 fresh 库跑全量回归就是那道闸；EMBED_ENABLED=0 不装 ml extras（torch）。
# 无 git remote 时本地等价验证：bash scripts/ci-local.sh（同一套门禁，见 docs/DEPLOY.md）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Python 全量回归：pgvector + redis 服务容器（默认连接串正好指向映射端口，无需覆盖）。
  # initdb 脚本挂进容器 —— fresh 数据目录自动建 aiink_app 角色 + 授权（与 compose 同款）。
  python:
    name: Python 全量回归（全新 PG）
    runs-on: ubuntu-latest
    env:
      EMBED_ENABLED: "0"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aiink
          POSTGRES_PASSWORD: aiink
          POSTGRES_DB: aiink
        ports:
          - 5432:5432
        volumes:
          - ./docker/initdb:/docker-entrypoint-initdb.d:ro
        options: >-
          --health-cmd "pg_isready -U aiink -d aiink"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖（dev extras，不装 ml/torch）
        run: pip install -e '.[dev]'
      - name: Python 格式门禁（零依赖语法/字节码检查）
        run: python -m compileall -q src tests
      - name: 初始化（建表 + RLS + seed，幂等）
        run: aiink init
      - name: 全量回归（期望 314 passed + 5 xfailed）
        run: python -m pytest tests/ -q

  # Go 网关：仅需 Redis（Python API 用 httptest 假服务，不依赖 8100）。
  # Redis 不通时 newTestRedis 会 t.Skipf 整体跳过而非失败——显式拦截「绿灯空转」。
  go:
    name: Go 网关（vet + 单测）
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
      - name: go vet
        working-directory: gateway
        run: go vet ./...
      - name: go test（拦截 SKIP：Redis 未就绪不允许静默通过）
        working-directory: gateway
        run: |
          go test -count=1 -v ./... > /tmp/go-test.log 2>&1
          rc=$?
          cat /tmp/go-test.log
          if grep -q -- '--- SKIP' /tmp/go-test.log; then
            echo "::error::检测到 SKIP（Redis 服务未就绪），CI 不允许绿灯空转"
            exit 1
          fi
          exit $rc

  # 前端：oxlint + vitest + tsc/vite build（纯 node 单测，无浏览器/后端）。
  frontend:
    name: 前端（lint + 单测 + 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: lint（oxlint）
        run: npm run lint
      - name: 单测（vitest）
        run: npm test
      - name: 构建（tsc -b && vite build）
        run: npm run build

  # 镜像构建：GitHub runner 境外网络用官方源即可（pypi / npmjs / goproxy），
  # 不需 daocloud/aliyun 覆盖（那是本地 compose 的国内源参数）。
  build-images:
    name: 镜像构建（Python + 网关）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python 镜像（api/worker 共用，核心依赖）
        run: docker build -f Dockerfile -t aiink-api:ci .
      - name: 网关镜像（node 构建 dist + go 静态编译 → slim）
        run: docker build -f gateway/Dockerfile -t aiink-gateway:ci .
