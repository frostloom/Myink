# 管理员专用测试设施：独立端口与数据卷，不运行 worker。
name: myink-admin-security-test
services:
  postgres:
    image: ${PG_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_USER: myink
      POSTGRES_PASSWORD: myink
      POSTGRES_DB: myink
    ports:
      - "127.0.0.1:35432:5432"
    volumes:
      - admin-test-pg:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myink -d myink"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    ports:
      - "127.0.0.1:36380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:3.13-management}
    environment:
      RABBITMQ_DEFAULT_USER: myink
      RABBITMQ_DEFAULT_PASS: myink
    ports:
      - "127.0.0.1:35673:5672"
    healthcheck:
      # 与 docker-compose.yml 同款：check_port_connectivity 才验证 5672 可连；gosu 降权避免
      # root 身份抢建 .erlang.cookie 锁死 uid 999 的 broker。
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 3s
      timeout: 10s
      retries: 30

volumes:
  admin-test-pg:
